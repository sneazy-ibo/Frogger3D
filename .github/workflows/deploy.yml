name: Deploy Frogger3D

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.target.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Determine deploy target
        id: target
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          if [ "$BRANCH" = "main" ]; then
            echo "dir=" >> "$GITHUB_OUTPUT"
            echo "url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          else
            SAFE=$(echo "$BRANCH" | tr '/' '-')
            echo "dir=branches/$SAFE" >> "$GITHUB_OUTPUT"
            echo "url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/branches/$SAFE/" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ steps.target.outputs.dir }}
          keep_files: true
